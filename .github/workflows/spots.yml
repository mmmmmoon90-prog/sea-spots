name: 바다낚시·차박 지도

on:
  schedule:
    - cron: "40 20 * * *"   # 매일 오전 5시 40분(한국 시간): 바다낚시지수만 새로 받아 지도 갱신
    - cron: "20 1 1 * *"    # 매달 1일 오전 10시 20분: 새 영상·댓글 수집과 장소 추출까지 전체 갱신
  workflow_dispatch:
    inputs:
      full:
        description: "1이면 영상 수집·추출까지 전체 실행, 0이면 지수와 지도만"
        default: "1"
      max_videos:
        description: "테스트용 댓글 수집 영상 수 제한 (0 = 전체)"
        default: "0"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sea-spots
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: github-pages
    env:
      FULL: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.full == '1') || github.event.schedule == '20 1 1 * *' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

      - name: 1. 영상·댓글 수집 (전체 실행 때만)
        if: env.FULL == 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          MAX_VIDEOS: ${{ github.event.inputs.max_videos || '0' }}
        run: |
          python collect.py
          git add data && (git commit -m "영상 수집 $(date -u +%F)" && git push) || echo "변경 없음"

      - name: 2. 장소 추출 (Claude, 전체 실행 때만)
        if: env.FULL == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python extract.py

      - name: 추출 결과 저장
        if: always() && env.FULL == 'true'
        run: git add data && (git commit -m "장소 추출 $(date -u +%F)" && git push) || echo "변경 없음"

      - name: 3. 바다낚시지수 받기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python fishing_index.py || echo "바다낚시지수를 받지 못해 이전 값으로 진행합니다"

      - name: 4. 위치 확인·화장실·지수 붙여서 지도 만들기
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: python build.py

      - name: 결과 저장
        if: always()
        run: git add data site && (git commit -m "지도 갱신 $(date -u +%F)" && git push) || echo "변경 없음"

      - uses: actions/upload-artifact@v4
        with:
          name: sea-spots-result
          path: |
            site/
            output/

      - name: 지도 사이트 올리기 준비
        if: hashFiles('site/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: GitHub Pages에 지도 게시
        if: hashFiles('site/index.html') != ''
        uses: actions/deploy-pages@v4
