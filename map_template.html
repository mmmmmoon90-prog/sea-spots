<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11252e">
<title>바다낚시·차박 지도</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#eef4f6; --panel:#fbfdfd; --ink:#11252e; --muted:#5f7680; --line:#d6e3e8; --chip:#e4eef1;
  --fish:#1673b5; --camp:#d9822b; --both:#6a4fc2; --ok:#2f8f5b; --ok-bg:#e3f3ea; --warn:#c0392b; --warn-bg:#fdecea;
  --me:#2b7cff; --shadow:0 8px 30px rgba(10,40,55,.16); --top:0px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1a20; --panel:#14232b; --ink:#e6f0f3; --muted:#93a9b2; --line:#263a44; --chip:#1c2f38;
  --fish:#4aa3e8; --camp:#f0a457; --both:#a08cf0; --ok:#4fc283; --ok-bg:#1d3326; --warn:#ff7a6b; --warn-bg:#3a1f1c;
  --me:#5a9bff; --shadow:0 8px 30px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#0e1a20; --panel:#14232b; --ink:#e6f0f3; --muted:#93a9b2; --line:#263a44; --chip:#1c2f38;
  --fish:#4aa3e8; --camp:#f0a457; --both:#a08cf0; --ok:#4fc283; --ok-bg:#1d3326; --warn:#ff7a6b; --warn-bg:#3a1f1c;
  --me:#5a9bff; --shadow:0 8px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif}
button{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:390px 1fr;grid-template-rows:auto 1fr;height:100dvh}
#top{grid-column:1;grid-row:1;background:var(--panel);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 18px 10px;z-index:3}
#side{grid-column:1;grid-row:2;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:2}
#map{grid-column:2;grid-row:1/3;height:100%;z-index:1}
h1{margin:0;font-size:20px;font-weight:900;letter-spacing:-.02em}
h1 .f{color:var(--fish)} h1 .c{color:var(--camp)}
.sub{margin:4px 0 10px;color:var(--muted);font-size:12px;line-height:1.5}
.search{display:flex;gap:8px}
.sbox{flex:1;min-width:0;display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:0 4px 0 12px}
.sbox input{flex:1;min-width:0;border:0;background:none;outline:0;font:inherit;font-size:16px;color:var(--ink);padding:10px 0}
.sbox input::-webkit-search-cancel-button{display:none}
#qx{border:0;background:none;width:36px;height:36px;font-size:18px;color:var(--muted);cursor:pointer}
select{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:0 10px;min-width:0;max-width:34%}
.chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:20px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.sep{flex:none;width:1px;background:var(--line);margin:4px 2px}
#sortbar{display:flex;align-items:center;gap:6px;padding:8px 18px;border-bottom:1px solid var(--line);font-size:13px}
#count{font-weight:700;margin-right:auto}
.sort{border:1px solid var(--line);background:none;border-radius:20px;padding:5px 11px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.sort.on{border-color:var(--ink);color:var(--ink);font-weight:700}
.note{font-size:11.5px;color:var(--muted);padding:6px 18px 0}
#list{overflow:auto;flex:1;min-height:0;padding-bottom:8px}
.item{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover,.item.on{background:var(--chip)}
.item .hd{display:flex;align-items:baseline;gap:8px}
.name{font-weight:700;font-size:15.5px;flex:1;min-width:0}
.km{font-size:13px;font-weight:700;color:var(--me);white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:20px;padding:1px 7px;margin-right:4px;vertical-align:1px}
.tf{background:color-mix(in srgb,var(--fish) 15%,transparent);color:var(--fish)}
.tc{background:color-mix(in srgb,var(--camp) 18%,transparent);color:var(--camp)}
.td{background:var(--ok-bg);color:var(--ok)}
.meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.icons{font-size:12.5px;margin-top:4px}
.memo-line{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid var(--panel);box-shadow:var(--shadow);color:#fff;position:relative}
.pin b{transform:rotate(45deg);font-size:13px}
.pin.fish{background:var(--fish)} .pin.camp{background:var(--camp)} .pin.both{background:var(--both)}
.pin.sel{outline:3px solid var(--ink);outline-offset:2px}
.pin.done::after{content:"✓";position:absolute;right:-6px;top:-6px;transform:rotate(45deg);width:16px;height:16px;border-radius:50%;background:var(--ok);color:#fff;font-size:10px;display:grid;place-items:center;font-weight:900}
.me{width:18px;height:18px;border-radius:50%;background:var(--me);border:3px solid #fff;box-shadow:0 0 0 6px color-mix(in srgb,var(--me) 25%,transparent)}
.marker-cluster{background:transparent}
.marker-cluster div{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--panel);font-weight:900;font-size:13px;border:3px solid var(--panel);box-shadow:var(--shadow)}
.leaflet-popup-content-wrapper{background:var(--panel);color:var(--ink);border-radius:14px;box-shadow:var(--shadow)}
.leaflet-popup-tip{background:var(--panel)}
.leaflet-popup-content{margin:14px 16px;font-family:inherit;width:300px!important;max-height:62vh;overflow:auto}
#locate{position:absolute;right:12px;top:calc(var(--top) + 10px);z-index:4;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);font-size:20px;cursor:pointer;display:grid;place-items:center}
#locate.on{color:var(--me);border-color:var(--me)}
#locate.busy{opacity:.6}
#app{position:relative}
/* 장소 상세 */
.pop h3{margin:0 0 4px;font-size:18px;line-height:1.3}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 4px}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-decoration:none;font-size:12px;font-weight:700;cursor:pointer;padding:6px 2px}
.act span{font-size:19px;line-height:1}
.act.main{background:var(--me);border-color:var(--me);color:#fff}
.sec{margin-top:12px;font-size:13.5px;line-height:1.6}
.sec>b{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.fac span{display:inline-block;margin:0 6px 4px 0;padding:3px 9px;border-radius:20px;background:var(--chip);font-size:12.5px}
.fac .y{background:var(--ok-bg);color:var(--ok)} .fac .n{opacity:.55;text-decoration:line-through}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 10px}
.rev{background:var(--chip);border-radius:8px;padding:6px 8px;margin-top:4px}
.idxwrap{overflow-x:auto}
table.idx{border-collapse:collapse;width:100%;font-size:12.5px}
table.idx td,table.idx th{border-bottom:1px solid var(--line);padding:4px 5px;text-align:left;white-space:nowrap}
.lv{font-weight:700} .lv.g{color:var(--ok)} .lv.b{color:var(--warn)}
.addr{display:flex;gap:8px;align-items:center;color:var(--muted)}
.addr button{flex:none;border:1px solid var(--line);background:none;border-radius:8px;padding:3px 8px;font-size:12px;cursor:pointer}
.vids a{display:inline-block;color:var(--fish);font-weight:700;margin:0 12px 4px 0;text-decoration:none}
.mine{border-top:1px dashed var(--line);margin-top:14px;padding-top:12px}
.visit{font-weight:700;font-size:14px;width:100%;border-radius:12px;padding:11px;cursor:pointer;border:1.5px solid var(--ok);background:transparent;color:var(--ok)}
.visit.on{background:var(--ok);color:#fff}
.mine textarea{font:inherit;font-size:16px;width:100%;margin-top:8px;min-height:70px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);color:var(--ink)}
.saved{font-size:11px;color:var(--muted);margin-top:4px;min-height:14px}
#grab,#detail{display:none}
#toast{position:absolute;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:20px;font-size:13px;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}

@media (max-width:760px){
  html,body{overflow:hidden;overscroll-behavior:none}
  #app{display:block;height:100dvh;overflow:hidden;overflow:clip}
  #map{position:absolute;inset:0;height:auto}
  #top{position:absolute;left:0;right:0;top:0;background:none;border:0;padding:calc(8px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));pointer-events:none}
  #top>*{pointer-events:auto}
  #top h1,#top .sub{display:none}
  .sbox{background:var(--panel);box-shadow:var(--shadow);border-radius:14px;min-height:48px}
  select{background:var(--panel);box-shadow:var(--shadow);border-radius:14px;min-height:48px;font-size:14px}
  .chips{padding:2px 0 6px}
  .chip{box-shadow:0 2px 8px rgba(10,40,55,.14);padding:8px 13px}
  .sep{display:none}
  #side{position:absolute;left:0;right:0;bottom:0;height:calc(100dvh - var(--top) - 6px);border-right:0;border-top:1px solid var(--line);
    border-radius:18px 18px 0 0;box-shadow:var(--shadow);transform:translateY(var(--off,0px));
    transition:transform .3s cubic-bezier(.2,.8,.2,1);will-change:transform;z-index:5}
  #side.drag{transition:none}
  #side.away{transform:translateY(100%)}
  #grab{display:flex;justify-content:center;padding:9px 0 3px;touch-action:none;cursor:grab;border:0;background:none;width:100%}
  #grab i{display:block;width:44px;height:5px;border-radius:5px;background:var(--muted);opacity:.45}
  #sortbar{touch-action:none;padding:4px 16px 10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));border-bottom:1px solid var(--line)}
  #count{font-size:15px}
  #list{padding-bottom:calc(var(--off,0px) + 12px);overscroll-behavior:contain}
  .item{padding:14px 16px}
  .leaflet-control-zoom{display:none}
  .leaflet-control-attribution{font-size:9px}
  #detail{display:flex;flex-direction:column;position:absolute;left:0;right:0;bottom:0;max-height:62dvh;background:var(--panel);border-radius:18px 18px 0 0;box-shadow:var(--shadow);z-index:6;
    transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
  #detail.on{transform:translateY(var(--doff,0px))}
  #detail.drag{transition:none}
  #dhead{display:flex;align-items:center;justify-content:center;position:relative;padding:9px 0 2px;touch-action:none}
  #dhead i{display:block;width:44px;height:5px;border-radius:5px;background:var(--muted);opacity:.45}
  #dclose{position:absolute;right:8px;top:4px;width:40px;height:40px;border:0;background:none;font-size:22px;color:var(--muted);cursor:pointer}
  #dbody{overflow:auto;padding:2px 16px calc(18px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
  #dbody .pop h3{padding-right:34px}
}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <h1><span class="f">바다낚시</span>·<span class="c">차박</span> 지도</h1>
    <p class="sub">유튜브 영상·댓글에서 모은 장소예요. 금지구역·야영 규정은 바뀔 수 있으니 출발 전에 지자체 안내를 꼭 확인하세요.</p>
    <div class="search">
      <label class="sbox"><input id="q" type="search" enterkeyhint="search" placeholder="장소·어종·지역 (예: 감성돔, 거제)" autocomplete="off"><button id="qx" type="button" aria-label="검색어 지우기" hidden>✕</button></label>
      <select id="region" aria-label="지역"><option value="">전체 지역</option></select>
    </div>
    <div class="chips" id="chips">
      <button class="chip on" data-g="layer" data-v="all">전체</button>
      <button class="chip" data-g="layer" data-v="fish">🎣 낚시</button>
      <button class="chip" data-g="layer" data-v="camp">🚐 차박</button>
      <span class="sep"></span>
      <button class="chip" data-g="opt" data-v="toilet">🚻 화장실</button>
      <button class="chip" data-g="opt" data-v="water">🚰 개수대</button>
      <button class="chip" data-g="opt" data-v="free">무료</button>
      <button class="chip" data-g="opt" data-v="good">👍 후기 좋음</button>
      <button class="chip" data-g="opt" data-v="idx">🎣 오늘 낚시 좋음</button>
      <button class="chip" data-g="opt" data-v="done">✓ 가본 곳</button>
      <button class="chip" data-g="opt" data-v="todo">안 가본 곳</button>
    </div>
  </div>
  <aside id="side">
    <button id="grab" type="button" aria-label="목록 크기 바꾸기"><i></i></button>
    <div id="sortbar">
      <span id="count"></span>
      <button class="sort on" data-s="rec" type="button">영상 많은 순</button>
      <button class="sort" data-s="near" type="button">📍 가까운 순</button>
    </div>
    <div class="note" id="indexNote"></div>
    <div class="note" id="storeNote" hidden></div>
    <div id="list"></div>
  </aside>
  <div id="map"></div>
  <button id="locate" type="button" aria-label="내 위치">📍</button>
  <section id="detail" aria-label="장소 정보">
    <div id="dhead"><i></i><button id="dclose" type="button" aria-label="닫기">✕</button></div>
    <div id="dbody"></div>
  </section>
  <div id="toast" role="status"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script>
const SPOTS = /*__SPOTS__*/[];
const META = /*__META__*/{};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
const MOBILE = matchMedia("(max-width:760px)").matches;
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2200); }

// ---------- 가봤어요·메모 (claude.ai 공유 페이지에서는 계정에, 그 외엔 이 브라우저에 저장) ----------
const MINE = {}; let store = null; const LS_KEY = "sea-spots-mine-v1";
function setNote(t) { const n = $("storeNote"); n.textContent = t; n.hidden = !t; }
async function initStore() {
  let db = null, uid = null;
  try { if (window.claude && claude.use) { const [d, u] = await Promise.all([claude.use("db"), claude.use("user")]); db = d; uid = u ? await u.id() : null; } } catch (e) {}
  if (db && uid) {
    const col = db.collection("data/users/" + uid);
    const t = setTimeout(() => setNote("저장된 기록을 아직 불러오지 못했어요."), 10000);
    col.onSnapshot(snap => {
      if (!snap.metadata.fromCache) { clearTimeout(t); setNote(""); }
      snap.docs.forEach(d => { if (d.exists) MINE[d.id] = {...d.data()}; });
      snap.docChanges().forEach(c => { if (c.type === "removed") delete MINE[c.doc.id]; });
      refreshMine();
    }, () => { clearTimeout(t); setNote("기록 동기화가 끊겼어요. 새로고침해 주세요."); });
    const busy = {};
    return { async save(k, rec) { while (busy[k]) await busy[k]; busy[k] = col.doc(k).set(rec).finally(() => { busy[k] = null; }); return busy[k]; } };
  }
  try { Object.assign(MINE, JSON.parse(localStorage.getItem(LS_KEY) || "{}")); } catch (e) {}
  setNote("가봤어요·메모는 이 폰(브라우저)에만 저장돼요.");
  return { async save() { try { localStorage.setItem(LS_KEY, JSON.stringify(MINE)); } catch (e) { throw e; } } };
}
const mineOf = s => MINE[s.key] || {};
async function saveMine(s, patch, st) {
  MINE[s.key] = {visited: false, memo: "", ...mineOf(s), ...patch, at: Date.now()};
  refreshMine();
  if (!store) return;
  st && (st.textContent = "저장 중…");
  try { await store.save(s.key, MINE[s.key]); st && (st.textContent = "저장됨"); }
  catch (e) { st && (st.textContent = "저장하지 못했어요. 다시 시도해 주세요."); }
}

// ---------- 지도 ----------
const KOREA = L.latLngBounds([33.1, 125.1], [38.6, 129.6]);
const map = L.map("map", {zoomControl: !MOBILE, minZoom: 6, zoomSnap: 0.5,
  maxBounds: L.latLngBounds([30.5, 121.5], [40.0, 133.0]), maxBoundsViscosity: 0.8});
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
const cluster = L.markerClusterGroup({showCoverageOnHover: false, maxClusterRadius: 50, chunkedLoading: true,
  iconCreateFunction: c => L.divIcon({html: `<div>${c.getChildCount()}</div>`, className: "marker-cluster", iconSize: [38, 38]})});
map.addLayer(cluster);

const cls = s => s.fishing && s.chabak ? "both" : s.fishing ? "fish" : "camp";
let selId = null;
const pinIcon = s => L.divIcon({className: "", iconSize: [30, 30], iconAnchor: [15, 30], popupAnchor: [0, -30],
  html: `<div class="pin ${cls(s)}${mineOf(s).visited ? " done" : ""}${s.id === selId ? " sel" : ""}"><b>${s.fishing && s.chabak ? "★" : s.fishing ? "🎣" : "🚐"}</b></div>`});
const hasToilet = s => ["yes", "near"].includes(s.fac.toilet);

// 오늘 이후 첫 예보에서 가장 좋은 지수를 대표값으로
const LV = {"매우좋음": 5, "좋음": 4, "보통": 3, "나쁨": 2, "매우나쁨": 1};
function todayIndex(s) {
  if (!s.index || !s.index.rows.length) return null;
  const today = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10).replace(/-/g, "");
  const rows = s.index.rows.filter(r => String(r.date || "").replace(/-/g, "") >= today);
  const first = rows.length ? String(rows[0].date) : null;
  const same = rows.filter(r => String(r.date) === first);
  return same.sort((a, b) => (LV[b.index] || 0) - (LV[a.index] || 0))[0] || null;
}
const LVTXT = {"매우좋음": "아주 좋음", "좋음": "좋음", "보통": "보통", "나쁨": "나쁨", "매우나쁨": "아주 나쁨"};
const lvTxt = v => LVTXT[v] || v || "";
const lvCls = v => (LV[v] || 3) >= 4 ? "g" : (LV[v] || 3) <= 2 ? "b" : "";

// ---------- 내 위치·거리 ----------
let me = null, meMarker = null;
function distKm(s) {
  if (!me) return null;
  const R = 6371, r = Math.PI / 180, dLa = (s.lat - me.lat) * r, dLo = (s.lon - me.lon) * r;
  const a = Math.sin(dLa / 2) ** 2 + Math.cos(me.lat * r) * Math.cos(s.lat * r) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
const fmtKm = d => d == null ? "" : d < 1 ? Math.round(d * 1000) + "m" : d < 10 ? d.toFixed(1) + "km" : Math.round(d) + "km";

// ---------- 길찾기 링크 ----------
const kakaoId = s => (String(s.kakao || "").match(/(\d+)\s*$/) || [])[1];
function links(s) {
  const id = kakaoId(s), q = encodeURIComponent(s.name + " " + (s.region || ""));
  return {
    route: id ? `https://map.kakao.com/link/to/${id}` : `https://map.kakao.com/?q=${q}`,
    kakao: s.kakao ? String(s.kakao).replace(/^http:/, "https:") : `https://map.kakao.com/?q=${q}`,
    naver: `https://map.naver.com/p/search/${q}`,
  };
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast("주소를 복사했어요"); }
  catch (e) { toast("복사하지 못했어요. 주소를 길게 눌러 복사하세요"); }
}

function detail(s) {
  const f = s.fac, el = document.createElement("div"); el.className = "pop";
  const L_ = links(s), d = distKm(s);
  const facs = [["toilet", "화장실"], ["flush_toilet", "수세식"], ["water", "개수대"], ["shower", "샤워"],
    ["free_parking", "무료주차"], ["free", "무료"], ["cooking_ok", "취사 가능"]]
    .filter(([k]) => f[k]).map(([k, n]) => `<span class="${f[k] === "no" ? "n" : "y"}">${f[k] === "near" ? "근처 " : ""}${n}</span>`).join("");
  const idx = s.index ? `<div class="sec"><b>날짜별 낚시 여건 · ${esc(s.index.name)} ${esc(s.index.type)} 기준(${s.index.km}km)</b>
    <div class="idxwrap"><table class="idx"><tr><th>날짜</th><th></th><th>어종</th><th>낚시</th><th>물때</th></tr>${
      s.index.rows.slice(0, 10).map(r => `<tr><td>${esc(String(r.date || "").slice(5).replace("-", "/"))}</td><td>${esc(r.noon || "")}</td><td>${esc(r.fish || "")}</td><td class="lv ${lvCls(r.index)}">${esc(lvTxt(r.index))}</td><td>${esc(r.tide || "")}</td></tr>`).join("")
    }</table></div></div>` : "";
  const vids = s.videos.map((v, i) => `<a href="https://youtu.be/${esc(v.id)}" target="_blank" rel="noopener">▶ ${esc(v.title || "영상 " + (i + 1))}</a>`).join("<br>");
  el.innerHTML = `<h3>${esc(s.name)}</h3>
    <div>${s.fishing ? '<span class="tag tf">낚시</span>' : ""}${s.chabak ? '<span class="tag tc">차박</span>' : ""}<span class="meta">${esc(s.region)} · ${esc(s.kind)}${d != null ? ` · <b style="color:var(--me)">${fmtKm(d)}</b>` : ""}</span></div>
    <div class="acts">
      <a class="act main" href="${esc(L_.route)}" target="_blank" rel="noopener"><span>🧭</span>길찾기</a>
      <a class="act" href="${esc(L_.kakao)}" target="_blank" rel="noopener"><span>🗺️</span>카카오맵</a>
      <a class="act" href="${esc(L_.naver)}" target="_blank" rel="noopener"><span>🅽</span>네이버</a>
      ${s.videos.length ? `<a class="act" href="https://youtu.be/${esc(s.videos[0].id)}" target="_blank" rel="noopener"><span>▶</span>영상</a>` : `<button class="act" type="button" data-copy><span>📋</span>주소</button>`}
    </div>
    ${s.today ? `<div class="sec"><b>오늘 낚시 여건 (물때·파도·바람·수온 등 종합)</b><span class="lv ${lvCls(s.today.index)}">낚시하기 ${esc(lvTxt(s.today.index))}</span> ${esc(s.today.fish || "")} · ${esc(s.today.tide || "")}</div>` : ""}
    ${s.warnings.length ? `<div class="sec warn"><b>주의</b>${s.warnings.map(esc).join("<br>")}</div>` : ""}
    ${s.species.length ? `<div class="sec"><b>어종</b>${esc(s.species.join(", "))}</div>` : ""}
    ${facs ? `<div class="sec fac"><b>편의시설</b>${facs}</div>` : ""}
    ${s.toilets.length ? `<div class="sec"><b>근처 공중화장실</b>${s.toilets.map(t => `${esc(t.name)} ${t.m}m`).join(" · ")}</div>` : ""}
    ${(s.points || []).length ? `<div class="sec"><b>세부 포인트</b>${s.points.map(p => `<div>· <b>${esc(p.n)}</b>${p.d ? ` ${esc(p.d)}` : ""}</div>`).join("")}</div>` : ""}
    ${s.tips.length ? `<div class="sec"><b>팁</b>${s.tips.map(t => "· " + esc(t)).join("<br>")}</div>` : ""}
    ${s.view.length ? `<div class="sec"><b>뷰</b>${esc(s.view.join(", "))}</div>` : ""}
    ${s.reviews.length ? `<div class="sec"><b>시청자 후기 (좋음 ${s.good} · 별로 ${s.bad})</b>${s.reviews.map(r => `<div class="rev">${r.v === "good" ? "👍" : r.v === "bad" ? "👎" : "🤔"} ${esc(r.t)}</div>`).join("")}</div>` : ""}
    ${idx}
    ${s.address ? `<div class="sec addr"><span>${esc(s.address)}</span><button type="button" data-copy>복사</button></div>` : ""}
    ${vids ? `<div class="sec vids"><b>영상 ${s.videos_n}개</b>${vids}</div>` : ""}
    <div class="mine"><button class="visit" type="button"></button>
      <textarea placeholder="메모·후기 (예: 우럭 5마리, 화장실 깨끗함, 주말엔 자리 없음)" maxlength="1000"></textarea><div class="saved"></div></div>`;
  el.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copyText(s.address || s.name));
  const btn = el.querySelector(".visit"), ta = el.querySelector("textarea"), st = el.querySelector(".saved");
  const paint = () => { const on = !!mineOf(s).visited; btn.classList.toggle("on", on); btn.textContent = on ? "✓ 가봤어요" : "가봤어요 체크"; };
  paint(); ta.value = mineOf(s).memo || "";
  btn.onclick = () => { saveMine(s, {visited: !mineOf(s).visited, memo: ta.value}, st); paint(); };
  let timer; const flush = () => { clearTimeout(timer); if (ta.value !== (mineOf(s).memo || "")) saveMine(s, {memo: ta.value}, st); };
  ta.oninput = () => { st.textContent = ""; clearTimeout(timer); timer = setTimeout(flush, 1200); };
  ta.onblur = flush;
  return el;
}

SPOTS.forEach((s, i) => {
  s.id = i; s.today = todayIndex(s);
  s.marker = L.marker([s.lat, s.lon], {icon: pinIcon(s), title: s.name});
  if (MOBILE) s.marker.on("click", () => openDetail(s));
  else s.marker.bindPopup(() => detail(s), {maxWidth: 340, autoPanPaddingTopLeft: [16, 16], autoPanPaddingBottomRight: [16, 16]});
  s.hay = [s.name, s.region, s.kind, s.aliases, ...(s.points || []).map(p => p.n + " " + p.d), ...s.species, ...s.view].join(" ").toLowerCase();
});
[...new Set(SPOTS.map(s => s.region.split(" ")[0]).filter(Boolean))].sort((a, b) => a.localeCompare(b, "ko"))
  .forEach(r => $("region").insertAdjacentHTML("beforeend", `<option>${esc(r)}</option>`));
$("indexNote").textContent = META.index_at ? `낚시 여건: 국립해양조사원 바다낚시지수(${META.index_at} 기준) · 금지구역·야영 규정은 출발 전 지자체 안내를 확인하세요` : "";

// ---------- 모바일: 위 검색창 높이, 아래 목록 시트 ----------
const side = $("side"), app = $("app");
function measureTop() { if (MOBILE) app.style.setProperty("--top", $("top").offsetHeight + "px"); }
const PEEK = () => $("grab").offsetHeight + $("sortbar").offsetHeight;
let sheetState = "peek", sheetOff = 0;
function offsets() { const h = side.offsetHeight; return {full: 0, half: Math.max(0, h - innerHeight * 0.5), peek: Math.max(0, h - PEEK())}; }
function applyOff(px) { sheetOff = px; side.style.setProperty("--off", px + "px"); }
function sheetShown() { return MOBILE && !side.classList.contains("away") ? side.offsetHeight - sheetOff : 0; }
function setSheet(st) { if (!MOBILE) return; sheetState = st; applyOff(offsets()[st]); }
function dragSheet(handle, getOff, setOff, onEnd) {
  let y0 = null, off0 = 0, t0 = 0, moved = false;
  handle.addEventListener("pointerdown", e => { if (e.target.closest("button.sort,#dclose")) return; y0 = e.clientY; off0 = getOff(); t0 = Date.now(); moved = false; handle.setPointerCapture(e.pointerId); onEnd.start && onEnd.start(); });
  handle.addEventListener("pointermove", e => { if (y0 === null) return; const dy = e.clientY - y0; if (Math.abs(dy) > 5) moved = true; setOff(off0 + dy); });
  const end = e => { if (y0 === null) return; const dy = e.clientY - y0, v = dy / Math.max(1, Date.now() - t0); y0 = null; onEnd(moved, dy, v); };
  handle.addEventListener("pointerup", end); handle.addEventListener("pointercancel", end);
}
if (MOBILE) {
  const end = (moved, dy, v) => {
    side.classList.remove("drag");
    const o = offsets();
    if (!moved) return setSheet(sheetState === "peek" ? "half" : "peek");
    if (v > 0.5) return setSheet(sheetOff > o.half ? "peek" : "half");
    if (v < -0.5) return setSheet(sheetOff < o.half ? "full" : "half");
    setSheet(Object.entries(o).sort((a, b) => Math.abs(a[1] - sheetOff) - Math.abs(b[1] - sheetOff))[0][0]);
  };
  end.start = () => side.classList.add("drag");
  const set = px => applyOff(Math.min(offsets().peek, Math.max(0, px)));
  dragSheet($("grab"), () => sheetOff, set, end);
  dragSheet($("sortbar"), () => sheetOff, set, end);
  map.on("click", () => { if (detailOn) closeDetail(); else if (sheetState !== "peek") setSheet("peek"); });
  map.on("dragstart", () => sheetState !== "peek" && !detailOn && setSheet("peek"));
  addEventListener("resize", () => { measureTop(); setSheet(sheetState); });
}

// ---------- 모바일: 장소 상세 시트 ----------
let detailOn = false, detailS = null;
const det = $("detail");
function select(s) {
  const prev = selId; selId = s ? s.id : null;
  [prev, selId].forEach(i => i != null && SPOTS[i] && SPOTS[i].marker.setIcon(pinIcon(SPOTS[i])));
}
function openDetail(s) {
  if (!MOBILE) { cluster.zoomToShowLayer(s.marker, () => s.marker.openPopup()); return; }
  select(s); detailS = s;
  $("dbody").innerHTML = ""; $("dbody").appendChild(detail(s)); $("dbody").scrollTop = 0;
  det.style.setProperty("--doff", "0px"); det.classList.add("on"); side.classList.add("away");
  if (!detailOn) history.pushState({detail: 1}, "");
  detailOn = true;
  requestAnimationFrame(() => {
    const z = Math.max(map.getZoom(), 12), h = det.offsetHeight;
    const p = map.project([s.lat, s.lon], z).add([0, (h - $("top").offsetHeight) / 2]);
    map.setView(map.unproject(p, z), z, {animate: true});
  });
}
function closeDetail(fromHistory) {
  if (!detailOn) return;
  detailOn = false; det.classList.remove("on"); side.classList.remove("away"); select(null); setSheet("peek");
  if (!fromHistory && history.state && history.state.detail) history.back();
}
addEventListener("popstate", () => closeDetail(true));
$("dclose").onclick = () => closeDetail();
if (MOBILE) {
  let doff = 0;
  const end = (moved, dy) => { det.classList.remove("drag"); if (!moved || dy > 90) { if (moved) closeDetail(); else { det.style.setProperty("--doff", "0px"); } } else det.style.setProperty("--doff", "0px"); };
  end.start = () => det.classList.add("drag");
  dragSheet($("dhead"), () => 0, px => { doff = Math.max(0, px); det.style.setProperty("--doff", doff + "px"); }, end);
}

// ---------- 필터·정렬 ----------
const state = {layer: "all", opt: new Set(), sort: "rec"};
$("chips").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (!c) return;
  if (c.dataset.g === "layer") { state.layer = c.dataset.v; document.querySelectorAll('.chip[data-g="layer"]').forEach(x => x.classList.toggle("on", x === c)); }
  else {
    const v = c.dataset.v;
    if (state.opt.has(v)) state.opt.delete(v); else { state.opt.add(v); if (v === "done") state.opt.delete("todo"); if (v === "todo") state.opt.delete("done"); }
    document.querySelectorAll('.chip[data-g="opt"]').forEach(x => x.classList.toggle("on", state.opt.has(x.dataset.v)));
  }
  render(true);
});
document.querySelectorAll(".sort").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.s === "near" && !me) { locate(true); return; }
  setSort(b.dataset.s); render(false);
  if (MOBILE && sheetState === "peek") setSheet("half");
}));
function setSort(v) { state.sort = v; document.querySelectorAll(".sort").forEach(x => x.classList.toggle("on", x.dataset.s === v)); }

function visible() {
  const q = $("q").value.trim().toLowerCase(), reg = $("region").value, o = state.opt;
  const words = q.split(/\s+/).filter(Boolean);
  const out = SPOTS.filter(s =>
    (state.layer === "all" || (state.layer === "fish" ? s.fishing : s.chabak)) &&
    (!reg || s.region.startsWith(reg)) &&
    words.every(w => s.hay.includes(w) || (mineOf(s).memo || "").toLowerCase().includes(w)) &&
    (!o.has("toilet") || hasToilet(s)) && (!o.has("water") || s.fac.water === "yes") &&
    (!o.has("free") || s.fac.free === "yes") && (!o.has("good") || s.good > s.bad) &&
    (!o.has("idx") || (s.today && (LV[s.today.index] || 0) >= 4)) &&
    (!o.has("done") || mineOf(s).visited) && (!o.has("todo") || !mineOf(s).visited));
  if (state.sort === "near" && me) out.sort((a, b) => distKm(a) - distKm(b));
  return out;
}
function render(redraw) {
  const shown = visible();
  if (redraw) { cluster.clearLayers(); cluster.addLayers(shown.map(s => s.marker)); }
  const done = SPOTS.filter(s => mineOf(s).visited).length;
  $("count").textContent = `${shown.length.toLocaleString()}곳` + (done ? ` · 가본 곳 ${done}` : "");
  $("list").innerHTML = shown.slice(0, 300).map(s => `<button type="button" class="item${s.id === selId ? " on" : ""}" data-id="${s.id}">
    <div class="hd"><span class="name">${esc(s.name)} ${mineOf(s).visited ? '<span class="tag td">✓</span>' : ""}</span><span class="km">${fmtKm(distKm(s))}</span></div>
    <div class="meta">${s.fishing ? '<span class="tag tf">낚시</span>' : ""}${s.chabak ? '<span class="tag tc">차박</span>' : ""}${esc(s.region)} · ${esc(s.kind)} · 영상 ${s.videos_n}</div>
    <div class="icons">${hasToilet(s) ? "🚻 " : ""}${s.fac.water === "yes" ? "🚰 " : ""}${s.fac.free === "yes" ? "무료 " : ""}${s.good ? `👍${s.good} ` : ""}${s.bad ? `👎${s.bad} ` : ""}${s.today ? `<span class="lv ${lvCls(s.today.index)}">🎣 오늘 ${esc(lvTxt(s.today.index))}</span> ` : ""}${s.species.slice(0, 4).map(esc).join(", ")}</div>
    ${mineOf(s).memo ? `<div class="memo-line">📝 ${esc(mineOf(s).memo)}</div>` : ""}</button>`).join("")
    + (shown.length > 300 ? `<p style="padding:14px 18px;color:var(--muted);font-size:13px">300곳까지 보여줘요. 검색이나 필터로 좁혀 보세요.</p>` : "")
    || `<p style="padding:18px;color:var(--muted)">조건에 맞는 장소가 없어요.</p>`;
  if (redraw && shown.length && shown.length < SPOTS.length) {
    const pts = (state.sort === "near" && me ? shown.slice(0, 15) : shown).map(s => [s.lat, s.lon]);
    if (state.sort === "near" && me) pts.push([me.lat, me.lon]);
    map.fitBounds(L.latLngBounds(pts), {maxZoom: 13, paddingTopLeft: [30, MOBILE ? $("top").offsetHeight + 20 : 60], paddingBottomRight: [MOBILE ? 30 : 30, 30 + sheetShown()]});
  }
}
const iconState = {};
function refreshMine() {
  SPOTS.forEach(s => { const v = !!mineOf(s).visited; if (iconState[s.key] !== v) { iconState[s.key] = v; s.marker.setIcon(pinIcon(s)); } });
  render(false);
}
$("list").addEventListener("click", e => {
  const el = e.target.closest(".item"); if (!el) return;
  const s = SPOTS[+el.dataset.id];
  if (MOBILE) { cluster.zoomToShowLayer(s.marker, () => openDetail(s)); return; }
  document.querySelectorAll(".item.on").forEach(x => x.classList.remove("on")); el.classList.add("on");
  openDetail(s);
});

// ---------- 검색 ----------
const q = $("q");
let qTimer; q.addEventListener("input", () => { $("qx").hidden = !q.value; clearTimeout(qTimer); qTimer = setTimeout(() => render(true), 300); });
q.addEventListener("focus", () => { if (MOBILE) { if (detailOn) closeDetail(); setSheet("half"); } });
q.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); clearTimeout(qTimer); render(true); q.blur(); if (MOBILE) setSheet("half"); } });
$("qx").onclick = () => { q.value = ""; $("qx").hidden = true; render(true); if (MOBILE) setSheet("peek"); };
$("region").addEventListener("change", () => render(true));

// ---------- 내 위치 ----------
function locate(sortNear) {
  if (!navigator.geolocation) { toast("이 브라우저는 위치를 지원하지 않아요"); return; }
  const btn = $("locate"); btn.classList.add("busy");
  navigator.geolocation.getCurrentPosition(p => {
    btn.classList.remove("busy"); btn.classList.add("on");
    me = {lat: p.coords.latitude, lon: p.coords.longitude};
    if (!meMarker) meMarker = L.marker([me.lat, me.lon], {icon: L.divIcon({className: "", html: '<div class="me"></div>', iconSize: [18, 18], iconAnchor: [9, 9]}), interactive: false, zIndexOffset: 1000}).addTo(map);
    else meMarker.setLatLng([me.lat, me.lon]);
    if (sortNear || state.sort !== "near") setSort("near");
    if (detailOn) closeDetail();
    render(false);
    const near = visible().slice(0, 12).map(s => [s.lat, s.lon]);
    map.fitBounds(L.latLngBounds([[me.lat, me.lon], ...near]), {maxZoom: 12, paddingTopLeft: [30, MOBILE ? $("top").offsetHeight + 20 : 60], paddingBottomRight: [30, 30 + (MOBILE ? innerHeight * 0.5 : 0)]});
    if (MOBILE) setSheet("half");
  }, err => {
    btn.classList.remove("busy");
    toast(err.code === 1 ? "위치 권한이 꺼져 있어요. 브라우저 설정에서 허용해 주세요" : "위치를 찾지 못했어요. 잠시 후 다시 시도해 주세요");
  }, {enableHighAccuracy: false, timeout: 10000, maximumAge: 300000});
}
$("locate").onclick = () => locate(false);
// 이미 위치 권한을 허용한 사람은 자동으로 가까운 순
try { navigator.permissions && navigator.permissions.query({name: "geolocation"}).then(r => { if (r.state === "granted") locate(true); }).catch(() => {}); } catch (e) {}

measureTop();
render(true);
setSheet("peek");
map.fitBounds(KOREA, {paddingTopLeft: [0, MOBILE ? $("top").offsetHeight : 0], paddingBottomRight: [0, sheetShown()], animate: false});
initStore().then(s => { store = s; refreshMine(); });
</script>
</body>
</html>
